# The gate, on every push to main and on every pull request.
#
# `make check` is the same command a developer runs before a commit: eslint,
# prettier, vitest, the interface build, cargo fmt, clippy, the tests, the
# release build, and the browser tests. One command, so the pipeline and the
# machine of the developer cannot drift apart.

name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A release commit is pushed with its tag, and the tag workflow runs this
    # same gate before it publishes. Two runs of it on one commit is twenty
    # minutes spent twice, and two chances for a flake to stop a release.
    if: >-
      github.event_name == 'pull_request' ||
      !startsWith(github.event.head_commit.message, 'chore(release): v')

    steps:
      - uses: actions/checkout@v4

      # `.tool-versions` is the one place the versions are written. It is
      # read here rather than named again, so asdf and the pipeline cannot
      # drift apart.
      - id: tools
        run: |
          {
            echo "node=$(awk '/^nodejs /{print $2}' .tool-versions)"
            echo "rust=$(awk '/^rust /{print $2}' .tool-versions)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tools.outputs.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the pinned Rust
        run: |
          rustup toolchain install '${{ steps.tools.outputs.rust }}' \
            --profile minimal --component clippy,rustfmt
          rustup default '${{ steps.tools.outputs.rust }}'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: make setup

      # The runner carries Google Chrome, which is what the browser tests
      # drive. Playwright downloads nothing.
      - run: make check
