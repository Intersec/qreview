# Two things happen here, and both talk to this GitLab server alone.
#
# On a merge request and on the default branch, `check` runs the same gate a
# developer runs before a commit. Enable "Pipelines must succeed" in the merge
# request settings so a red pipeline blocks the merge.
#
# On a tag, the gate runs again, then `release` builds the static Linux
# x86-64 binary, uploads it to the package registry of this project, and
# creates the release that links to it. A tag whose gate is red publishes
# nothing.
#
# The jobs need a runner with network access to the crates.io and npm
# registries. Do not commit a registry token: expose it as a protected CI/CD
# variable.
#
# A server behind a private certificate authority: the release job trusts the
# CA that the runner passes in `CI_SERVER_TLS_CA_FILE`, and the one the
# project sets in `ADDITIONAL_CA_CERT_BUNDLE`. Either is enough.

stages:
  - verify
  - release

.rust:
  image: rust:1.92
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  cache:
    key:
      files:
        - Cargo.lock
        - web/package-lock.json
    paths:
      - .cargo-home/
      - web/node_modules/
      - target/

check:
  extends: .rust
  stage: verify
  interruptible: true
  before_script:
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
    # chromium is what the browser tests drive. Without it `make check` says
    # it skipped them, which is worse than a pipeline that runs them.
    - apt-get install -y --no-install-recommends nodejs chromium
    - rustup component add clippy rustfmt
    - make setup
  script:
    - make check
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# The one artifact of a release: a static binary that runs on any Linux
# x86-64, with no Node, no cargo and no shared library to find. It travels
# compressed, which takes it from 6.4M to 2.5M.
release:
  extends: .rust
  stage: release
  needs:
    - check
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
    # No C toolchain: Rust links musl with its own bundled linker. node
    # builds the interface, and writes the JSON of the release. xz packs it.
    - apt-get install -y --no-install-recommends nodejs xz-utils
    # A GitLab server behind a private CA. Two places carry it: the runner,
    # which sets CI_SERVER_TLS_CA_FILE when it is configured with one, and
    # the project, through ADDITIONAL_CA_CERT_BUNDLE. Either is enough, and
    # a server with a public certificate needs neither.
    - |
      ca=${ADDITIONAL_CA_CERT_BUNDLE:-${CI_SERVER_TLS_CA_FILE:-}}
      if [ -n "$ca" ]; then
        target=/usr/local/share/ca-certificates/gitlab-server.crt
        if [ -f "$ca" ]; then cp "$ca" "$target"; else printf '%s\n' "$ca" > "$target"; fi
        update-ca-certificates
        echo "the certificate authority of the server is trusted"
      fi
    - make setup
  script:
    - make dist TAG="$CI_COMMIT_TAG"
    - scripts/release-notes.sh "$CI_COMMIT_TAG" > dist/notes.md
    - |
      scripts/gitlab-release.sh "$CI_COMMIT_TAG" \
        "dist/qreview-${CI_COMMIT_TAG}-linux-x86_64.xz" \
        dist/notes.md
  artifacts:
    paths:
      - dist/*.xz
      - dist/notes.md
