[workspace]
members = ["crates/qreview", "crates/xtask"]
# `cargo run` and `make dev` mean the tool, not the chore runner.
default-members = ["crates/qreview"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/nicopauss/qreview"

[workspace.dependencies]
anyhow = "1"

[profile.release]
# The binary is handed to a colleague as one file. Trade build time for size.
strip = true
lto = "thin"
codegen-units = 1
